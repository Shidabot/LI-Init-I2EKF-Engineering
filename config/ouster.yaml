common:
    lid_topic:  "/ouster/points"
    imu_topic:  "/imu/data"
#    lid_topic: "/os_cloud_node/points"
#    imu_topic: "/mavros/imu/data_raw"

preprocess:
    lidar_type: 3                # Ouster LiDAR
    scan_line: 32
    blind: 2
    feature_extract_en: false

initialization:
    cut_frame_num: 4 # must be positive integer
    orig_odom_freq: 10
    mean_acc_norm: 9.805
    online_refine_time: 15
    data_accum_length: 700
    Rot_LI_cov: [ 0.00005, 0.00005, 0.00005 ]
    Trans_LI_cov: [ 0.0001, 0.0001, 0.0001 ]

    max_acc_bias: 1.0
    min_translation_eigenvalue: 1.0e-6
    max_translation_condition: 1000000.0
    min_time_correlation: 0.2

mapping:
    max_iteration: 10          # IEKF iterations per undistortion update
    filter_size_surf: 0.05
    filter_size_map: 0.15
    gyr_cov: 40
    acc_cov: 2
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    det_range: 150.0

i2ekf_frontend:
    enable: true
    max_undistort: 3
    lidar_cov: 0.001
    outer_rot_converge_deg: 1.0
    outer_trans_converge_cm: 1.0
    adaptive_cov_enable: false
    adaptive_cov_K: 1.0
    adaptive_cov_a: 1.5
    adaptive_cov_b: 5.0

publish:
    path_en:  true
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

pcd_save:
    pcd_save_en: false
    interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
